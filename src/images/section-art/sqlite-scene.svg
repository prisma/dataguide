  <defs><linearGradient id="sqlite-disc0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d64a"/><stop offset="1" stop-color="#d9a800"/></linearGradient><linearGradient id="sqlite-disc1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6be9f0"/><stop offset="1" stop-color="#00aebb"/></linearGradient><linearGradient id="sqlite-disc2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7788a"/><stop offset="1" stop-color="#d8324a"/></linearGradient><clipPath id="sqlite-phone"><rect x="170" y="82" width="76" height="128" rx="16"/></clipPath></defs>
  <!-- The phone, held at its left edge (the fingers are behind it) -->
