  <circle cx="231" cy="95" r="2.6" fill="#b3bcc8"/>
  <rect x="183" y="124" width="50" height="9" rx="4.5" fill="#dfe4eb"/>
  <circle cx="186" cy="146" r="3.4" fill="#F3C306"/><rect x="194" y="143" width="34" height="6" rx="3" fill="#c6ccd6"/><circle cx="186" cy="162" r="3.4" fill="#01D7E4"/><rect x="194" y="159" width="26" height="6" rx="3" fill="#c6ccd6"/><circle cx="186" cy="178" r="3.4" fill="#F34A60"/><rect x="194" y="175" width="38" height="6" rx="3" fill="#c6ccd6"/>
  <rect x="196.0" y="199" width="24" height="3.5" rx="1.75" fill="#b3bcc8"/>
