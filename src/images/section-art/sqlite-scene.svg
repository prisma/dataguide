    <path d="M193 48 H218 L230 60 V97 Q230 102 225 102 H193 Q188 102 188 97 V53 Q188 48 193 48 Z" fill="none" stroke="url(#prismEdge)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M218 48 V57 Q218 60 221 60 H230 Z" fill="#e4e9f0" stroke="#c9d0da" stroke-width=".8" stroke-linejoin="round"/>
    <path d="M199.0 76.0 A11 3.4 0 0 0 221.0 76.0 V81.5 A11 3.4 0 0 1 199.0 81.5 Z" fill="url(#sqlite-disc2)"/><path d="M199.0 70.5 A11 3.4 0 0 0 221.0 70.5 V76.0 A11 3.4 0 0 1 199.0 76.0 Z" fill="url(#sqlite-disc1)"/><path d="M199.0 65.0 A11 3.4 0 0 0 221.0 65.0 V70.5 A11 3.4 0 0 1 199.0 70.5 Z" fill="url(#sqlite-disc0)"/><path d="M199.0 70.5 A11 3.4 0 0 0 221.0 70.5" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".8"/><path d="M199.0 76.0 A11 3.4 0 0 0 221.0 76.0" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".8"/><ellipse cx="210.0" cy="65" rx="11" ry="3.4" fill="#f9fafc" stroke="#e3e8ef" stroke-width=".6"/>
  <!-- the phone's glass front, over the part of the file that is already inside, and its screen -->
