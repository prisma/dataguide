  </g>
  <rect x="170" y="82" width="76" height="128" rx="16" fill="url(#sweep)" fill-opacity=".07"/>
  <rect x="170.75" y="82.75" width="74.5" height="126.5" rx="15.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

