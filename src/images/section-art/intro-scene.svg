<svg xmlns="http://www.w3.org/2000/svg" width="192" height="186" viewBox="58 34 192 186">
  <!-- Prismo storing a record in a database. Brand style: chrome, glass and the prism colours
       cyan #01D7E4, yellow #F3C306 and red #F34A60. -->
  <defs>
    <!-- chrome -->
    <radialGradient id="chrome" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset=".35" stop-color="#dfe5ec"/>
      <stop offset=".62" stop-color="#aeb8c6"/>
      <stop offset=".85" stop-color="#7c8797"/>
      <stop offset="1" stop-color="#5f6a79"/>
    </radialGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset=".55" stop-color="#b3bcc8"/>
      <stop offset="1" stop-color="#7f8a99"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f9aa8"/>
      <stop offset=".35" stop-color="#e6eaf0"/>
      <stop offset="1" stop-color="#7c8797"/>
    </linearGradient>
    <linearGradient id="mitt" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fdfdfe"/>
      <stop offset=".55" stop-color="#cfd6df"/>
      <stop offset="1" stop-color="#8f9aa8"/>
    </linearGradient>
    <!-- the visor: three flat prism bands (never recoloured) -->
    <linearGradient id="visor" gradientUnits="userSpaceOnUse" x1="0" y1="-12" x2="0" y2="15">
      <stop offset="0" stop-color="#01D7E4"/><stop offset=".3333" stop-color="#01D7E4"/>
      <stop offset=".3333" stop-color="#F3C306"/><stop offset=".6667" stop-color="#F3C306"/>
      <stop offset=".6667" stop-color="#F34A60"/><stop offset="1" stop-color="#F34A60"/>
    </linearGradient>
    <linearGradient id="visorShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121212" stop-opacity=".3"/>
      <stop offset=".22" stop-color="#121212" stop-opacity="0"/>
      <stop offset=".78" stop-color="#121212" stop-opacity="0"/>
      <stop offset="1" stop-color="#121212" stop-opacity=".3"/>
    </linearGradient>
    <!-- glass -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f4f8"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01D7E4"/>
      <stop offset=".5" stop-color="#F3C306"/>
      <stop offset="1" stop-color="#F34A60"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".7" y2=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prismEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#01D7E4"/>
      <stop offset=".5" stop-color="#F3C306"/>
      <stop offset="1" stop-color="#F34A60"/>
    </linearGradient>
    <clipPath id="headClip"><circle cx="0" cy="0" r="35"/></clipPath>
    <clipPath id="visorClip"><path d="M-36 -12 Q0 -9 36 -12 L36 13 Q0 16 -36 13 Z"/></clipPath>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="280%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#121212" flood-opacity=".14"/>
    </filter>
  </defs>
  <defs><linearGradient id="disc0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9fafc"/><stop offset="1" stop-color="#c9d0da"/></linearGradient><linearGradient id="disc1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d64a"/><stop offset="1" stop-color="#d9a800"/></linearGradient><linearGradient id="disc2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6be9f0"/><stop offset="1" stop-color="#00aebb"/></linearGradient><linearGradient id="disc3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7788a"/><stop offset="1" stop-color="#d8324a"/></linearGradient></defs>
  <clipPath id="aboveRim">
    <rect x="0" y="0" width="260" height="104"/>
    <ellipse cx="196" cy="104" rx="48" ry="11"/>
  </clipPath>

  <!-- The database: glass discs -->
  <g filter="url(#soft)">
    <path d="M134 176 A62 15 0 0 0 258 176 V202 A62 15 0 0 1 134 202 Z" fill="url(#disc3)" fill-opacity=".9"/><path d="M134 150 A62 15 0 0 0 258 150 V176 A62 15 0 0 1 134 176 Z" fill="url(#disc2)" fill-opacity=".9"/><path d="M134 124 A62 15 0 0 0 258 124 V150 A62 15 0 0 1 134 150 Z" fill="url(#disc1)" fill-opacity=".9"/><path d="M134 104 A62 15 0 0 0 258 104 V124 A62 15 0 0 1 134 124 Z" fill="url(#disc0)" fill-opacity=".9"/>
    <path d="M134 124 A62 15 0 0 0 258 124" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/><path d="M134 150 A62 15 0 0 0 258 150" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/><path d="M134 176 A62 15 0 0 0 258 176" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/>
    <ellipse cx="196" cy="104" rx="62" ry="15" fill="#f9fafc" stroke="#e3e8ef"/>
  </g>
  <path d="M134 104 V202 A62 15 0 0 0 258 202 V104 Z" fill="url(#sweep)" fill-opacity=".07"/>
  <path d="M134.75 202 V104" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <ellipse cx="166" cy="120" rx="14" ry="4" fill="#fff" fill-opacity=".7" filter="url(#blur2)"/>
  <!-- the opening: recessed, with a prism ring -->
  <ellipse cx="196" cy="104" rx="48" ry="11" fill="#cfd6df"/>
  <ellipse cx="196" cy="101" rx="42" ry="7" fill="#8f9aa8" fill-opacity=".55" filter="url(#blur2)"/>
  <ellipse cx="196" cy="104" rx="48" ry="11" fill="none" stroke="url(#prismEdge)" stroke-width="1.5"/>

  <g transform="translate(106 100) rotate(3)" filter="url(#soft)">
    <!-- foot -->
    <path d="M-9 32 h18 l2.5 6 h-23 z" fill="url(#foot)"/>
    <ellipse cx="0" cy="38" rx="11.5" ry="1.6" fill="#6f7a89"/>
    <!-- ear cups -->
    <g>
      <ellipse cx="-35" cy="1" rx="8" ry="12" fill="url(#ear)" stroke="#fff" stroke-opacity=".8" stroke-width="1"/>
      <ellipse cx="-35" cy="1" rx="4.48" ry="9" fill="#c3cad4"/>
      <ellipse cx="35" cy="1" rx="5" ry="12" fill="url(#ear)" stroke="#fff" stroke-opacity=".8" stroke-width="1"/>
      <ellipse cx="35" cy="1" rx="2.8" ry="9" fill="#c3cad4"/>
    </g>
    <!-- head: chrome with cool and warm reflections -->
    <circle cx="0" cy="0" r="35" fill="url(#chrome)"/>
    <g clip-path="url(#headClip)"><g filter="url(#blur6)">
          <ellipse cx="-16" cy="-12" rx="22" ry="20" fill="#9fd6ff" fill-opacity=".28"/>
          <ellipse cx="20" cy="-8" rx="18" ry="22" fill="#f6c86a" fill-opacity=".32"/>
          <ellipse cx="0" cy="30" rx="26" ry="8" fill="#f2c66d" fill-opacity=".18"/>
    </g></g>
    <!-- visor -->
    <path d="M-36 -12 Q0 -9 36 -12 L36 13 Q0 16 -36 13 Z" fill="url(#visor)" clip-path="url(#headClip)"/>
    <path d="M-36 -12 Q0 -9 36 -12 L36 13 Q0 16 -36 13 Z" fill="url(#visorShade)" clip-path="url(#headClip)"/>
    <g clip-path="url(#visorClip)" opacity=".5"><g filter="url(#blur6)">
          <ellipse cx="-16" cy="-12" rx="22" ry="20" fill="#9fd6ff" fill-opacity=".28"/>
          <ellipse cx="20" cy="-8" rx="18" ry="22" fill="#f6c86a" fill-opacity=".32"/>
          <ellipse cx="0" cy="30" rx="26" ry="8" fill="#f2c66d" fill-opacity=".18"/>
    </g></g>
    <!-- hatch seam -->
    <path d="M-25 -26 L-21 -16 Q0 -10 21 -16 L25 -26" fill="none" stroke="#6d7787" stroke-width="1.2" stroke-linejoin="round" clip-path="url(#headClip)"/>
    <path d="M-24 -25 L-20.4 -15 Q0 -9 20.4 -15 L24 -25" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1" clip-path="url(#headClip)"/>
    <!-- face -->
    <g transform="translate(5 0)">
      <path d="M-16 -5 q4 -3 8 -1" fill="none" stroke="#0e1014" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M16 -8 q-4 -3 -8 -1" fill="none" stroke="#0e1014" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="-12" cy="1" rx="3.5" ry="5.6" fill="#0e1014"/>
      <ellipse cx="12" cy="1" rx="3.5" ry="5.6" fill="#0e1014"/>
      <ellipse cx="-13.2" cy="-1" rx="1.1" ry="2" fill="#fff" fill-opacity=".5"/>
      <ellipse cx="10.8" cy="-1" rx="1.1" ry="2" fill="#fff" fill-opacity=".5"/>
      <path d="M-7 16 Q0 22 8 16" fill="none" stroke="#1c1f26" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- soft highlight and grain -->
    <ellipse cx="-14" cy="-18" rx="9" ry="6" fill="url(#shine)"/>
    <rect x="-35" y="-35" width="70" height="70" filter="url(#grain)" opacity=".06" clip-path="url(#headClip)"/>
  </g>

  <!-- the record, dropping into the opening; the hand holds its top-left corner -->
  <path d="M180 67 l0 -10" stroke="#01D7E4" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  <path d="M186 67 l0 -16" stroke="#F3C306" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  <path d="M192 67 l0 -10" stroke="#F34A60" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(166 74) rotate(14) scale(1.3)" filter="url(#soft)"><ellipse cx="-.5" cy="-6.8" rx="3.3" ry="2.4" transform="rotate(-30 -.5 -6.8)" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/></g>
  <g clip-path="url(#aboveRim)">
    <g transform="translate(164 70) rotate(14)" filter="url(#soft)">
      <rect x="0" y="2" width="58" height="34" rx="8" fill="#e4e9f0"/>
    <rect x="0" y="0" width="58" height="34" rx="8" fill="url(#glass)"/>
    <rect x="0" y="0" width="58" height="34" rx="8" fill="url(#sweep)" fill-opacity=".2"/>
    <rect x=".75" y=".75" width="56.5" height="32.5" rx="7.25" fill="none" stroke="url(#prismEdge)" stroke-width="1.5"/>
    <circle cx="12" cy="11" r="4" fill="#F3C306"/><rect x="22" y="7" width="26" height="8" rx="4" fill="#01D7E4" fill-opacity=".8"/><rect x="10" y="21" width="38" height="7" rx="3.5" fill="#F34A60" fill-opacity=".6"/>
    </g>
  </g>
  <!-- the database's front rim, in front of the record -->
  <path d="M148 104 A48 11 0 0 0 244 104" fill="none" stroke="url(#prismEdge)" stroke-width="1.5"/>
  <g transform="translate(166 74) rotate(14) scale(1.3)" filter="url(#soft)"><rect x="3" y="-5.6" width="10.5" height="3.8" rx="1.9" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/><path d="M8.6 -5.199999999999999v3" stroke="#121212" stroke-opacity=".3" stroke-width=".6"/><rect x="3" y="-1.9" width="10.5" height="3.8" rx="1.9" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/><path d="M8.6 -1.5v3" stroke="#121212" stroke-opacity=".3" stroke-width=".6"/><rect x="3" y="1.8" width="10.5" height="3.8" rx="1.9" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/><path d="M8.6 2.2v3" stroke="#121212" stroke-opacity=".3" stroke-width=".6"/><ellipse cx="0" cy="0" rx="7.5" ry="6.8" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".7"/></g>
  <!-- the other hand rests on the database's rim -->
  <g transform="translate(150 114) rotate(8) scale(1.3)" filter="url(#soft)"><rect x="3" y="-5.6" width="10.5" height="3.8" rx="1.9" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/><path d="M8.6 -5.199999999999999v3" stroke="#121212" stroke-opacity=".3" stroke-width=".6"/><rect x="3" y="-1.9" width="10.5" height="3.8" rx="1.9" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/><path d="M8.6 -1.5v3" stroke="#121212" stroke-opacity=".3" stroke-width=".6"/><rect x="3" y="1.8" width="10.5" height="3.8" rx="1.9" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/><path d="M8.6 2.2v3" stroke="#121212" stroke-opacity=".3" stroke-width=".6"/><ellipse cx="0" cy="0" rx="7.5" ry="6.8" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".7"/><ellipse cx="-.5" cy="-6.8" rx="3.3" ry="2.4" transform="rotate(-30 -.5 -6.8)" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/></g>
</svg>
