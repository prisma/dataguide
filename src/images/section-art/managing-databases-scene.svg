  <rect x="284" y="146" width="50" height="8" rx="4" fill="#c6ccd6"/>
  <rect x="284" y="162" width="36" height="8" rx="4" fill="#c6ccd6"/>
  <!-- the database it monitors, in front of the dashboard -->
  <defs><linearGradient id="managing-databases-db-disc0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9fafc"/><stop offset="1" stop-color="#c9d0da"/></linearGradient><linearGradient id="managing-databases-db-disc1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d64a"/><stop offset="1" stop-color="#d9a800"/></linearGradient><linearGradient id="managing-databases-db-disc2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6be9f0"/><stop offset="1" stop-color="#00aebb"/></linearGradient><linearGradient id="managing-databases-db-disc3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7788a"/><stop offset="1" stop-color="#d8324a"/></linearGradient></defs>
  <g filter="url(#soft)">
    <path d="M142 172 A28 7.5 0 0 0 198 172 V184 A28 7.5 0 0 1 142 184 Z" fill="url(#managing-databases-db-disc3)" fill-opacity=".9"/><path d="M142 160 A28 7.5 0 0 0 198 160 V172 A28 7.5 0 0 1 142 172 Z" fill="url(#managing-databases-db-disc2)" fill-opacity=".9"/><path d="M142 148 A28 7.5 0 0 0 198 148 V160 A28 7.5 0 0 1 142 160 Z" fill="url(#managing-databases-db-disc1)" fill-opacity=".9"/><path d="M142 138 A28 7.5 0 0 0 198 138 V148 A28 7.5 0 0 1 142 148 Z" fill="url(#managing-databases-db-disc0)" fill-opacity=".9"/>
    <path d="M142 148 A28 7.5 0 0 0 198 148" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/><path d="M142 160 A28 7.5 0 0 0 198 160" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/><path d="M142 172 A28 7.5 0 0 0 198 172" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/>
