  <g transform="translate(184 49) rotate(-8) scale(1.3)" filter="url(#soft)"><rect x="3" y="-5.6" width="10.5" height="3.8" rx="1.9" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/><path d="M8.6 -5.199999999999999v3" stroke="#121212" stroke-opacity=".3" stroke-width=".6"/><rect x="3" y="-1.9" width="10.5" height="3.8" rx="1.9" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/><path d="M8.6 -1.5v3" stroke="#121212" stroke-opacity=".3" stroke-width=".6"/><rect x="3" y="1.8" width="10.5" height="3.8" rx="1.9" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/><path d="M8.6 2.2v3" stroke="#121212" stroke-opacity=".3" stroke-width=".6"/><ellipse cx="0" cy="0" rx="7.5" ry="6.8" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".7"/><ellipse cx="-.5" cy="-6.8" rx="3.3" ry="2.4" transform="rotate(-30 -.5 -6.8)" fill="url(#mitt)" stroke="#8f9aa8" stroke-width=".6"/></g>
