name: Database tutorials
on:
  pull_request:
    paths:
      [
        'content/09-database-tools/02-evaluating-type-safety-in-the-top-8-typescript-orms.md',
        'experiments/orm-type-safety/**',
        '.github/workflows/tutorials.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'content/09-database-tools/02-evaluating-type-safety-in-the-top-8-typescript-orms.md',
        'experiments/orm-type-safety/**',
      ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node experiments/orm-type-safety/run.mjs
      - name: Preserve compiler and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orm-comparison-evidence
          path: experiments/orm-type-safety/.verification-runs/
