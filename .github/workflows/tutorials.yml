name: Database tutorials
on:
  pull_request:
    paths:
      [
        'content/**',
        'tests/tutorials/**',
        'experiments/orm-type-safety/**',
        'content-verification.json',
        '.github/workflows/tutorials.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'content/**',
        'tests/tutorials/**',
        'experiments/orm-type-safety/**',
        'content-verification.json',
      ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node tests/tutorials/run.mjs
      - name: Preserve actual run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgresql-tutorial-evidence
          path: .verification-runs/
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node experiments/orm-type-safety/run.mjs
      - name: Preserve compiler and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orm-comparison-evidence
          path: experiments/orm-type-safety/.verification-runs/
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node tests/tutorials/sqlite.mjs
      - name: Preserve SQLite tutorial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sqlite-tutorial-evidence
          path: .verification-runs/
  mongodb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node tests/tutorials/mongodb.mjs
      - name: Preserve MongoDB transaction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mongodb-tutorial-evidence
          path: .verification-runs/
